[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xp"
version = "0.1.0"
description = "X(Twitter) 포스팅 자동화 — Grok API 콘텐츠 생성 + Google Drive 업로드 + X 자동 포스팅"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
phase2 = [
    "tweepy>=4.14",
]
browser = [
    "DrissionPage>=4.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
xp = "xp.cli:main"

[tool.setuptools.packages.find]
include = ["xp*"]
